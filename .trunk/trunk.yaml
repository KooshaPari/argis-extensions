---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# See https://docs.trunk.io/reference/trunk-yaml for the configuration format.
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      ref: v1.6.6
      uri: https://github.com/trunk-io/plugins

lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint

  definitions:
    - name: black
      commands:
        - name: black-check
          run: black --check --line-length 100 ${target}
          success_codes: [0, 1]
          output: pass_fail
          direct_configs:
            - pyproject.toml
            - ruff.toml
        - name: black-format
          run: black --line-length 100 ${target}
          success_codes: [0, 1]
          output: rewrite
          formatter: true
          in_place: true
          direct_configs:
            - pyproject.toml

    - name: clippy
      commands:
        - name: clippy
          run: cargo clippy --all-targets --all-features -- -D warnings
          success_codes: [0]
          output: clippy

    - name: eslint
      direct_configs:
        - .eslintrc.*
        - eslint.config.*

    - name: golangci-lint
      direct_configs:
        - .golangci.yml
        - .golangci.yaml

    - name: mypy
      commands:
        - name: mypy
          run: mypy --ignore-missing-imports ${target}
          success_codes: [0]
          output: mypy

    - name: ruff
      commands:
        - name: ruff
          run: ruff check --output-format=github ${target}
          success_codes: [0, 1]
          output: pass_fail
          direct_configs:
            - ruff.toml
            - pyproject.toml

    - name: rustfmt
      formatter: true
      commands:
        - name: rustfmt
          run: rustfmt ${target}
          success_codes: [0, 1]
          output: pass_fail

actions:
  enabled: []
