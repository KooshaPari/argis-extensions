name: coverage-gate

on:
  pull_request:
    branches: [main, chore/**]

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - pheno-errors
          - pheno-otel
          - pheno-port-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-llvm-cov --quiet
      - name: Generate LCOV for ${{ matrix.crate }}
        run: cargo llvm-cov --manifest-path "${{ matrix.crate }}/Cargo.toml" --lcov --output-path "lcov-${{ matrix.crate }}.info"
      - name: Check 80% threshold
        run: |
          pct=$(cargo llvm-cov --manifest-path "${{ matrix.crate }}/Cargo.toml" --no-cfg-coverage 2>/dev/null | grep -oE 'Coverage [0-9.]+%' | head -1 | grep -oE '[0-9.]+')
          echo "coverage=$pct%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80) { print "FAIL: " p "% < 80%"; exit 1 } else { print "PASS: " p "% >= 80%" } }'
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.crate }}
          path: lcov-${{ matrix.crate }}.info
