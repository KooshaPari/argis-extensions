name: chaos
on:
  schedule:
    # Weekly: Monday 09:00 PDT (16:00 UTC) per ADR-041 refresh cadence
    - cron: '0 16 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chaos:
    name: chaos test (L11.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34
        with:
          go-version: '1.22'
      - name: Run chaos tests
        run: go test -tags=chaos -count=1 -p=1 -timeout 10m ./... -run 'Chaos|chaos_'
