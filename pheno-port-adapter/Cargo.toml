[package]
name = "pheno-port-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace]

[dependencies]
thiserror = "2.0"
# Canonical OTLP wire-format export substrate (ADR-037).
# `pheno-port-adapter` uses `pheno-otel` to surface
# connection-lifecycle spans (connect/disconnect/error) to OTLP/HTTP
# collectors when wired into a wider observability stack (per
# ADR-023 Rule 3.1: every substrate ships observability).
pheno-otel = { path = "../pheno-otel" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Concurrency model checker (v14 cycle-4 T5: L25 pillar).
# Permutation-tests the port-adapter dispatch table under concurrent
# lookups (`tests/loom_adapter_dispatch.rs`) and the HexCachePort impl
# swap under contention (`tests/loom_hexcache.rs`). Stable Rust
# 1.82+ compatible; no nightly required. Run with:
#   LOOM_MAX_PREEMPTIONS=1 RUSTFLAGS="--cfg loom" cargo test --test loom_<name> --release
loom = "0.7"
